  <div
    id="root"
    data-composition-id="intro"
    data-width="1920"
    data-height="1080"
    data-layout-allow-overflow
    data-layout-allow-overlap
  >
    <div id="intro-stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <div id="intro-world">
      <div id="intro-bg"></div>
      <div id="intro-rays"></div>
      <div id="intro-streak-a" class="intro-streak"></div>
      <div id="intro-streak-b" class="intro-streak"></div>
      <div id="intro-glow"></div>
      <div id="intro-hud">
        <svg viewBox="0 0 600 600">
          <circle
            id="intro-ring"
            cx="300"

            stroke="#e02828"
            stroke-width="5"
            stroke-linecap="round"
            transform="rotate(-90 300 300)"
          />
          <circle
            id="intro-ring-gold"
            cx="300"
            cy="300"
            r="248"
            fill="none"
            stroke="#f5c542"
            stroke-width="2"
            stroke-dasharray="4 14"
          />
        </svg>
        <div id="intro-ticks">
          <svg viewBox="0 0 600 600">
            <g id="intro-tick-group" stroke="#f5c542" stroke-width="4" stroke-linecap="round">

              <line x1="300" y1="578" x2="300" y2="600" />
              <line x1="0" y1="300" x2="22" y2="300" />

  </div>

  <script>
    (function () {
      // Seeded PRNG so the spark burst is identical on every render.
      let seed = 20261123;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      const sparksHost = document.getElementById("intro-sparks");
      const sparks = [];
      for (let i = 0; i < 46; i++) {
        const s = document.createElement("div");
        s.className = "intro-spark";
        const size = 3 + rand() * 7;
        const gold = rand() > 0.45;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.marginLeft = -size / 2 + "px";
        s.style.marginTop = -size / 2 + "px";
        s.style.background = gold ? "#ffd86b" : "#ff4a3a";
        s.style.boxShadow = "0 0 " + size * 2 + "px " + (gold ? "#f5c542" : "#ff2a2a");
        sparksHost.appendChild(s);
        const angle = rand() * Math.PI * 2;
        const dist = 260 + rand() * 620;
        sparks.push({ el: s, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist * 0.8, d: 0.9 + rand() * 0.9 });
      }

      // Split the title into letters for a per-letter reveal.
      const title = document.getElementById("intro-title");
      const text = title.textContent;
      title.textContent = "";
      const letters = [];
      for (const ch of text) {
        const span = document.createElement("span");
        span.textContent = ch === " " ? " " : ch;
        title.appendChild(span);
        letters.push(span);
      }

      const ring = document.getElementById("intro-ring");
      const C = 2 * Math.PI * 270;
      ring.setAttribute("stroke-dasharray", String(C));

      const tl = gsap.timeline({ paused: true });
      const HIT = 2.0;

      // Ground and slow world rotation (constant speed is the point: linear).
      tl.fromTo("#intro-bg", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 0);
      tl.fromTo("#intro-rays", { rotation: 0, opacity: 0 }, { rotation: 32, duration: 8, ease: "none" }, 0);
      tl.to("#intro-rays", { opacity: 1, duration: 0.6, ease: "power2.out" }, HIT);

      // Light streaks cross the frame, building toward the hit.
      tl.fromTo(
        "#intro-streak-a",
        { x: -1200, opacity: 0 },
        { x: 2000, opacity: 1, duration: 1.1, ease: "power2.in" },
        0.15,
      );
      tl.fromTo(
        "#intro-streak-b",
        { x: 2000, opacity: 0 },
        { x: -1200, opacity: 1, duration: 1.0, ease: "power3.in" },
        0.7,
      );

      // HUD ring draws itself, gold ring and ticks spin up.
      tl.fromTo(ring, { attr: { "stroke-dashoffset": C }, opacity: 1 }, { attr: { "stroke-dashoffset": 0 }, duration: 1.05, ease: "power2.inOut" }, 0.9);
      tl.fromTo("#intro-ring-gold", { opacity: 0, rotation: -60, svgOrigin: "300 300" }, { opacity: 0.9, rotation: 40, svgOrigin: "300 300", duration: 1.4, ease: "power3.out" }, 1.1);
      tl.to("#intro-ring-gold", { rotation: 110, svgOrigin: "300 300", duration: 5.5, ease: "none" }, 2.5);
      tl.fromTo("#intro-ticks", { rotation: -135, scale: 1.4, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 1.0, ease: "expo.out" }, 1.3);
      tl.fromTo("#intro-hud", { scale: 0.92 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0.9);

      // Glow charges before the logo lands.
      tl.fromTo("#intro-glow", { opacity: 0, scale: 0.4 }, { opacity: 0.9, scale: 0.8, duration: 1.0, ease: "power2.in" }, 1.0);
      tl.to("#intro-glow", { opacity: 0.65, scale: 1, duration: 1.4, ease: "expo.out" }, HIT);

      // Logo slams in from the camera.
      tl.fromTo(
        "#intro-logo-wrap",
        { scale: 3.2, opacity: 0, filter: "blur(18px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.in" },
        HIT - 0.42,
      );
      tl.fromTo("#intro-logo-wrap", { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out", immediateRender: false }, HIT);
      tl.to("#intro-logo-wrap", { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.6)" }, HIT + 0.08);

      // Impact: flash, shockwave, camera shake, spark burst.
      tl.set("#intro-flash", { visibility: "visible" }, HIT - 0.02);
      tl.set("#intro-flash", { visibility: "hidden" }, HIT + 0.6);
      tl.fromTo("#intro-flash", { opacity: 0 }, { opacity: 0.95, duration: 0.05, ease: "none" }, HIT - 0.02);
      tl.to("#intro-flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, HIT + 0.04);
      tl.fromTo("#intro-shock", { scale: 0.6, opacity: 0 }, { scale: 0.6, opacity: 1, duration: 0.01 }, HIT);
      tl.to("#intro-shock", { scale: 4.2, opacity: 0, borderWidth: 1, duration: 0.85, ease: "expo.out" }, HIT + 0.01);
      const shake = [
        [18, -12],
        [-14, 10],
        [10, 8],
        [-8, -6],
        [5, 4],
        [-2, -2],
        [0, 0],
      ];
      tl.fromTo("#intro-stage", { x: 0, y: 0 }, { x: 0, y: 0, duration: 0.01 }, 0);
      shake.forEach(function (p, i) {
        tl.to("#intro-stage", { x: p[0], y: p[1], duration: 0.04, ease: "none" }, HIT + i * 0.04);
      });
      sparks.forEach(function (s) {
        tl.fromTo(s.el, { x: 0, y: 0, opacity: 0, scale: 1 }, { x: 0, y: 0, opacity: 1, duration: 0.01 }, HIT);
        tl.to(s.el, { x: s.x, y: s.y, duration: s.d, ease: "expo.out" }, HIT + 0.01);
        tl.to(s.el, { opacity: 0, scale: 0.2, duration: s.d * 0.6, ease: "power2.in" }, HIT + 0.01 + s.d * 0.4);
      });

      // Metallic shine across the logo.
      tl.fromTo("#intro-shine-bar", { x: -200, rotation: 20 }, { x: 460, rotation: 20, duration: 0.9, ease: "power2.inOut" }, 2.55);
      tl.fromTo("#intro-shine-bar", { x: -200, rotation: 20 }, { x: 460, rotation: 20, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 5.6);

      // Title: per letter, blur and light-up.
      tl.fromTo(
        letters,
        { opacity: 0, y: 26, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.045 },
        2.75,
      );
      tl.fromTo("#intro-rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 3.1);
      tl.fromTo(
        "#intro-sub",
        { opacity: 0, filter: "blur(8px)", y: 14 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.9, ease: "expo.out" },
        3.55,
      );

      // Outro: push through and dip to black.
      tl.to("#intro-logo-wrap", { scale: 1.12, filter: "blur(10px)", opacity: 0, duration: 0.55, ease: "power3.in" }, 7.25);
      tl.to(["#intro-title", "#intro-rule", "#intro-sub"], { opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 7.15);
      tl.to("#intro-hud", { scale: 1.5, opacity: 0, duration: 0.55, ease: "power3.in" }, 7.2);
      tl.fromTo("#intro-world", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.65);

      window.__timelines["intro"] = tl;
    })();
  </script>
