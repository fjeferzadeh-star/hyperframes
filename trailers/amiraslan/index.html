<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #stage-ground {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="50"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-ground"></div>

      <!-- Scenes, back to back on lane 1 -->
      <div
        id="alley"
        data-composition-id="alley"
        data-composition-src="compositions/alley.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="card1"
        data-composition-id="card1"
        data-composition-src="compositions/card1.html"
        data-start="7.5"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="roof"
        data-composition-id="roof"
        data-composition-src="compositions/roof.html"
        data-start="10"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="door"
        data-composition-id="door"
        data-composition-src="compositions/door.html"
        data-start="14"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="wardrobe"
        data-composition-id="wardrobe"
        data-composition-src="compositions/wardrobe.html"
        data-start="18"
        data-duration="8.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="card2"
        data-composition-id="card2"
        data-composition-src="compositions/card2.html"
        data-start="26.5"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="tv"
        data-composition-id="tv"
        data-composition-src="compositions/tv.html"
        data-start="29"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="leap"
        data-composition-id="leap"
        data-composition-src="compositions/leap.html"
        data-start="36"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="finale"
        data-composition-id="finale"
        data-composition-src="compositions/finale.html"
        data-start="42"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <!-- Letterbox + film grain over everything -->
      <div
        id="film"
        data-composition-id="film"
        data-composition-src="compositions/film.html"
        data-start="0"
        data-duration="50"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 10"
      ></div>

      <!-- Sound -->
      <audio
        id="rain-bed"
        class="clip"
        src="assets/sfx/rain-bed.mp3"
        data-start="0"
        data-duration="42"
        data-track-index="3"
        data-volume="0.55"
        data-fade-in="1"
        data-fade-out="0.6"
      ></audio>
      <audio
        id="sfx-cat"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="3.15"
        data-duration="0.57"
        data-track-index="4"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-card1"
        class="clip"
        src="assets/sfx/whoosh.mp3"
        data-start="7.45"
        data-duration="0.57"
        data-track-index="4"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-thunder"
        class="clip"
        src="assets/sfx/impact-bass-2.mp3"
        data-start="11.75"
        data-duration="2.25"
        data-track-index="4"
        data-volume="0.7"
      ></audio>
      <audio
        id="sfx-slam"
        class="clip"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="25.67"
        data-duration="2"
        data-track-index="4"
        data-volume="0.85"
      ></audio>
      <audio
        id="sfx-tv"
        class="clip"
        src="assets/sfx/glitch-1.mp3"
        data-start="33.2"
        data-duration="1.2"
        data-track-index="4"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-grab"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="36.35"
        data-duration="0.57"
        data-track-index="4"
        data-volume="0.7"
      ></audio>
      <audio
        id="sfx-leap"
        class="clip"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="38.2"
        data-duration="3.6"
        data-track-index="4"
        data-volume="0.8"
        data-fade-out="0.8"
      ></audio>
      <audio
        id="sfx-riser"
        class="clip"
        src="assets/sfx/riser.mp3"
        data-start="42.6"
        data-duration="3.4"
        data-media-start="0.5"
        data-track-index="5"
        data-volume="0.6"
        data-fade-in="0.5"
      ></audio>
      <audio
        id="sfx-impact"
        class="clip"
        src="assets/sfx/impact-bass-2.mp3"
        data-start="45.97"
        data-duration="2.5"
        data-track-index="4"
        data-volume="0.9"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
